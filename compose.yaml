services:
  app:
    build: .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-matchpoint}:${POSTGRES_PASSWORD:-change-me-local}@db:5432/${POSTGRES_DB:-matchpoint}
      SESSION_SECRET: ${SESSION_SECRET:-local-development-secret-change-this}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-matchpoint}
      POSTGRES_USER: ${POSTGRES_USER:-matchpoint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres-data:
